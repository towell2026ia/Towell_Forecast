# Existing Towell_Forecast/main connection; no second repo/site or credentials.
[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_SITE_URL = "https://towell-forecastia.netlify.app"

# Netlify's automatically managed Next/OpenNext adapter handles SSR and routes.
# Supabase public URL/key are configured by the owner in Netlify, not committed.

name: CI
on:
  push:
  pull_request:

jobs:
  public-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-public-repo.py

  backend:
    runs-on: ubuntu-latest
    needs: public-repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/assistant_api/requirements.txt
      - run: python -m pip install -r services/assistant_api/requirements.txt coverage==7.10.7 ruff==0.13.0 pip-audit==2.9.0
      - run: pip-audit -r services/assistant_api/requirements.txt --progress-spinner off
      - run: ruff check services/assistant_api --select E9,F63,F7,F82
      - run: python -m compileall -q services
      - run: python -c "import services.assistant_api.api, services.assistant_api.settings, services.assistant_api.persistence"
      - run: coverage run --source=services.assistant_api --omit='*/test_*.py,*/__main__.py,*/serve.py,*/persistence_admin.py' -m unittest discover -s services/assistant_api -p 'test_*.py' -q
      - run: coverage report -m --fail-under=81
      - run: python -m unittest discover -s services/statistical_engine -p 'test_*.py' -q
      - run: python -m unittest discover -s services/ml_engine -p 'test_*.py' -q
      - run: python -m unittest discover -s services/ensemble_engine -p 'test_*.py' -q
      - run: python -m unittest discover -s services/decision_engine -p 'test_*.py' -q
      - run: python -m unittest discover -s services/closure_engine -p 'test_*.py' -q
      - run: docker build -f Dockerfile.api -t forecast-towell-api:ci .
      - name: Container and volume restart smoke
        run: |
          set -euo pipefail
          trap 'docker stop forecast-towell-ci-1 forecast-towell-ci-2 >/dev/null 2>&1 || true' EXIT
          docker volume create forecast-towell-ci-state
          docker run --rm -d --name forecast-towell-ci-1 --health-interval=1s \
            -p 127.0.0.1:18080:18081 -v forecast-towell-ci-state:/var/lib/forecast-towell \
            -e APP_ENV=test -e PORT=18081 \
            forecast-towell-api:ci
          for i in {1..30}; do
            if curl -fs http://127.0.0.1:18080/api/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/ready >/dev/null
          for i in {1..20}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' forecast-towell-ci-1)" = healthy ]; then break; fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' forecast-towell-ci-1)" = healthy
          docker exec forecast-towell-ci-1 python -c "from pathlib import Path; from services.assistant_api.persistence import LocalPersistenceProvider; p=LocalPersistenceProvider(Path('/var/lib/forecast-towell/historical/historical.sqlite3')); p.put('source_evidence','TEST-CI-VOLUME',{'status':'persisted'})"
          docker stop forecast-towell-ci-1 >/dev/null
          docker run --rm -d --name forecast-towell-ci-2 -p 127.0.0.1:18080:18081 \
            -v forecast-towell-ci-state:/var/lib/forecast-towell -e APP_ENV=test -e PORT=18081 \
            forecast-towell-api:ci
          docker exec forecast-towell-ci-2 python -c "from pathlib import Path; from services.assistant_api.persistence import LocalPersistenceProvider; p=LocalPersistenceProvider(Path('/var/lib/forecast-towell/historical/historical.sqlite3')); assert p.get('source_evidence','TEST-CI-VOLUME') == {'status':'persisted'}"
          for i in {1..30}; do
            if curl -fs http://127.0.0.1:18080/api/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/ready >/dev/null

  frontend:
    runs-on: ubuntu-latest
    needs: public-repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
